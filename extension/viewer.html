<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>img2img result</title>
  <script src="shared/theme.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f2f2f3;
      --text: #3a3a3a;
      --strong: #111;
      --muted: #6b6b6b;
      --panel: #ffffff;
      --strip: #f8f8f9;
      --border: #dcdcdf;
      --control-border: #c8c8cc;
      --thumb: #e4e4e7;
      --nav-bg: rgba(0, 0, 0, 0.08);
      --nav-fg: #333;
      --link: #1a5fd0;
      --scroll: #c4c4c8;
      --scroll-hover: #a0a0a6;
      --checker-a: #e4e4e7;
      --checker-b: #f4f4f5;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0e0e0e;
      --text: #ccc;
      --strong: #fff;
      --muted: #999;
      --panel: #171717;
      --strip: #121212;
      --border: #262626;
      --control-border: #404040;
      --thumb: #262626;
      --nav-bg: rgba(255, 255, 255, 0.15);
      --nav-fg: #fff;
      --link: #8ab4f8;
      --scroll: #3a3a3a;
      --scroll-hover: #555;
      --checker-a: #262626;
      --checker-b: #1c1c1c;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* The download button sits on the image's top-right corner, like the on-page one (the window can be
       much wider than a portrait image) */
    #frame {
      position: relative;
      line-height: 0;
    }
    img {
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
    }
    #download {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 40px;
      height: 40px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Dark mode, shared with the popup and the other extension pages */
    .theme-toggle {
      position: fixed;
      bottom: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: var(--nav-bg);
      color: var(--nav-fg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .theme-toggle:hover,
    #download:hover:not(:disabled) {
      background: rgba(52, 113, 219, 0.9);
    }
    #download:disabled {
      opacity: 0.45;
      cursor: default;
    }
    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="frame">
    <button id="download" title="Download processed image" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
    </button>
    <img id="result" alt="Swapped image" hidden>
  </div>
  <p id="message" hidden></p>
  <script src="viewer.js"></script>
</body>
</html>
