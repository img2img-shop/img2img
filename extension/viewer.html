<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>img2img result</title>
  <script src="shared/theme.js"></script>
  <link rel="stylesheet" href="shared/pages.css">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }
    body {
      display: flex;
    }
    /* Centred by their margins, so an image zoomed past the window can be scrolled to its top and left edges */
    #frame,
    #message {
      margin: auto;
    }
    /* The buttons sit on the image's top-right corner, like the on-page ones (the window can be much wider
       than a portrait image): download, with the original/result toggle, compare and delete under it */
    #frame {
      position: relative;
      line-height: 0;
    }
    /* Fitted to the window at the browser's usual zoom, and growing with it from there: the window measures
       fewer CSS pixels the further in it's zoomed, so --zoom (set in viewer.js) makes up for it. Without it
       zooming in would leave the image the size it was. */
    img {
      max-width: calc(100vw * var(--zoom, 1));
      max-height: calc(100vh * var(--zoom, 1));
      object-fit: contain;
    }
    #frame button {
      position: absolute;
      right: 12px;
      width: 40px;
      height: 40px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      /* (over a comparison laid on the image, which content.js puts just under its own buttons) */
      z-index: 2147483647;
    }
    /* Side by side, a comparison has the whole window, with what it needs in its own bar */
    #frame:has(img[data-img2img-comparing="window"]) button {
      display: none;
    }
    /* The icons come from content.js, so they're sized here rather than in their markup */
    #frame button svg {
      width: 20px;
      height: 20px;
    }
    /* Each under the one before it; a hidden button leaves its place empty, like the on-page buttons do */
    #download { top: 12px; }
    #revert { top: 58px; }
    #compare { top: 104px; }
    #reprocess { top: 150px; }
    #delete { top: 196px; }
    #frame.no-original #delete { top: 58px; }
    /* Dark mode, shared with the popup and the other extension pages */
    .theme-toggle {
      position: fixed;
      bottom: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: var(--nav-bg);
      color: var(--nav-fg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .theme-toggle:hover,
    #frame button:hover:not(:disabled) {
      background: rgba(52, 113, 219, 0.9);
    }
    #delete:hover:not(:disabled) {
      background: rgba(198, 40, 40, 0.9);
    }
    #frame button:disabled {
      opacity: 0.45;
      cursor: default;
    }
    /* "Show Icons on Hover" (resultIconsOnHover, set in All settings): the buttons wait for the pointer to be
       over the image, as the icons on a page do. Set on #frame by viewer.js. */
    #frame.on-hover button {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s;
    }
    #frame.on-hover:hover button {
      opacity: 1;
      pointer-events: auto;
    }
    #frame.on-hover:hover button:disabled {
      opacity: 0.45;
    }
    #message {
      font-size: 15px;
      text-align: center;
      line-height: 1.5;
    }
    /* (the dialog that asks before deleting is styled in shared/pages.css) */
  </style>
</head>
<body>
  <div id="frame">
    <button id="download" title="Download processed image" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
    </button>
    <!-- The toggle between the original image and the result, and the comparison laid over it, as on the page
         (their icons are set in viewer.js, from content.js's) -->
    <button id="revert" hidden></button>
    <button id="compare" title="Compare with the original" hidden></button>
    <!-- Processing the original again (reprocessImage, from content.js) -->
    <button id="reprocess" title="Process again" hidden></button>
    <button id="delete" title="Delete from the cache (Delete key)" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
    </button>
    <img id="result" alt="Swapped image" hidden>
  </div>
  <p id="message" hidden></p>
  <dialog id="confirmDelete">
    <form method="dialog">
      <p>Delete this image from the cache?</p>
      <label id="deleteFileRow" hidden><input type="checkbox" id="deleteFile"> <span id="deleteFileText"></span></label>
      <label id="dontAskRow"><input type="checkbox" id="dontAskDelete"> Don't ask again</label>
      <div class="buttons">
        <button value="cancel">Cancel</button>
        <button value="delete" autofocus>Delete</button>
      </div>
    </form>
  </dialog>
  <!-- The content script too, which Chrome doesn't inject into extension pages: Manual Selection works on the result
       (see viewer.js) -->
  <script src="shared/workflows.js"></script>
  <script src="shared/custom-workflows.js"></script>
  <script src="shared/images.js"></script>
  <script src="shared/sites.js"></script>
  <script src="content.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
